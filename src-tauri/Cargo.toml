[package]
name = "convix"
description = "Convix — drag, drop, convert."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "convix_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
convix-core.workspace = true
convix-image.workspace = true
convix-audio.workspace = true
convix-pdf.workspace = true
convix-modules.workspace = true

serde.workspace = true
serde_json.workspace = true
rayon = "1"

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Updates from GitHub Releases, checked with our signing key; Windows TLS (SChannel).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# Explorer context menu, HKCU only — no admin rights
winreg = "0.56"
