[package]
name = "convertio"
description = "ConvertIO — drag, drop, convert."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "convertio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
convertio-core.workspace = true
convertio-image.workspace = true
convertio-audio.workspace = true
convertio-pdf.workspace = true
convertio-modules.workspace = true

serde.workspace = true
serde_json.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Phase 4: tauri-plugin-updater (needs a signing key + manifest URL first)
# Phase 1: tauri-plugin-dialog (save-as dialog for the "ask each time" output mode)
# Phase 1: winreg (Explorer context menu, HKCU only — no admin rights)
