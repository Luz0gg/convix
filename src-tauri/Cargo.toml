[package]
name = "convertio"
description = "ConvertIO — drag, drop, convert."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "convertio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
convertio-core.workspace = true
convertio-image.workspace = true
convertio-audio.workspace = true
convertio-pdf.workspace = true
convertio-modules.workspace = true

serde.workspace = true
serde_json.workspace = true
rayon = "1"

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Phase 4: tauri-plugin-updater (needs a signing key + manifest URL first)

[target.'cfg(windows)'.dependencies]
# Explorer context menu, HKCU only — no admin rights
winreg = "0.56"
