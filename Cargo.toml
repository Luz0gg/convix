[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Luz0gg"]
repository = "https://github.com/Luz0gg/convix"

[workspace.dependencies]
# Internal crates
convix-core = { path = "crates/convix-core" }
convix-image = { path = "crates/convix-image" }
convix-audio = { path = "crates/convix-audio" }
convix-pdf = { path = "crates/convix-pdf" }
convix-modules = { path = "crates/convix-modules" }

# Shared third-party
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
infer = "0.19"

# Small binary, fast code. See https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# panic stays "unwind" on purpose: a decoder bug on a corrupt file must fail that one job
# (caught with catch_unwind), not crash the whole app.

# Image/audio codecs are painfully slow unoptimized: optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 2
