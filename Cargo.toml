[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Luz0gg"]
repository = "https://github.com/Luz0gg/convertio"

[workspace.dependencies]
# Internal crates
convertio-core = { path = "crates/convertio-core" }
convertio-image = { path = "crates/convertio-image" }
convertio-audio = { path = "crates/convertio-audio" }
convertio-pdf = { path = "crates/convertio-pdf" }
convertio-modules = { path = "crates/convertio-modules" }

# Shared third-party
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
infer = "0.19"

# Small binary, fast code. See https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image/audio codecs are painfully slow unoptimized: optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 2
