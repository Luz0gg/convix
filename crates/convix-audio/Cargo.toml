[package]
name = "convix-audio"
description = "Convix audio converter (drives the ffmpeg module)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
convix-core.workspace = true

[target.'cfg(windows)'.dependencies]
# Job Object: ffmpeg.exe is killed with Convix (no orphan conversion after a crash).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
