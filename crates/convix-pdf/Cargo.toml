[package]
name = "convix-pdf"
description = "Convix PDF tools (merge, split, compress, PDF <-> images)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
convix-core.workspace = true
convix-image.workspace = true
lopdf = { version = "0.47", default-features = false }

# Pages → images with the PDF renderer built into Windows (Windows.Data.Pdf): nothing to download.
[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Foundation",
  "Data_Pdf",
  "Storage",
  "Storage_Streams",
  "Win32_System_Com",
] }
