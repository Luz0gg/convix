[package]
name = "convertio-image"
description = "ConvertIO image converter (pure Rust, no external module)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
convertio-core.workspace = true

# Planned (Phase 1), added when implemented:
# image    — decode/encode PNG, JPEG, GIF, BMP, TIFF, ICO, WebP (lossless)
# oxipng   — lossless PNG optimization
# mozjpeg  — better JPEG compression
# webp     — lossy WebP encoding (libwebp)
# ravif    — AVIF encoding
# fast_image_resize — SIMD resizing
